name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
      SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This repo deploys the committed static dist/ build output.
      # Keep these secrets configured in GitHub Actions:
      # - SFTP_HOST
      # - SFTP_USERNAME
      # - SFTP_KNOWN_HOSTS (full known_hosts entry for the SFTP host)
      # - SFTP_PRIVATE_KEY (preferred) or SFTP_PASSWORD (fallback)
      - name: Verify built site artifact
        run: |
          test -d dist
          test -f dist/index.html

      - name: Configure pinned SFTP host key
        run: |
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$GITHUB_WORKSPACE/.sftp-known_hosts"
          chmod 600 "$GITHUB_WORKSPACE/.sftp-known_hosts"

      - name: Validate deploy credentials
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USERNAME" ] || [ -z "$SFTP_KNOWN_HOSTS" ]; then
            echo "Set SFTP_HOST, SFTP_USERNAME, and SFTP_KNOWN_HOSTS before running this deploy." >&2
            exit 1
          fi

          if [ -z "$SFTP_PRIVATE_KEY" ] && [ -z "$SFTP_PASSWORD" ]; then
            echo "Set SFTP_PRIVATE_KEY or SFTP_PASSWORD before running this deploy." >&2
            exit 1
          fi

      # The IONOS account is SFTP-restricted and rejects remote shell exec calls.
      # Keep delete_remote_files disabled or deploy will fail; removed local files can remain remotely.
      - name: Deploy via native SFTP
        run: |
          batch_file="$RUNNER_TEMP/deploy.sftp"
          printf '%s\n' 'put -R dist /public/fanfares' > "$batch_file"
          host_key_algorithms="$(
            awk '
              /^[[:space:]]*($|#)/ { next }
              {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^(ssh-ed25519|ssh-rsa|ssh-dss|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521|sk-ssh-ed25519@openssh.com|sk-ecdsa-sha2-nistp256@openssh.com)$/) {
                    print $i
                  }
                }
              }
            ' "$GITHUB_WORKSPACE/.sftp-known_hosts" | sort -u | paste -sd, -
          )"
          host_key_algorithms_option=()
          if [ -n "$host_key_algorithms" ]; then
            host_key_algorithms_option=(-o "HostKeyAlgorithms=$host_key_algorithms")
          else
            echo "Warning: could not parse host key algorithms from SFTP_KNOWN_HOSTS; using OpenSSH defaults." >&2
          fi

          if [ -n "$SFTP_PRIVATE_KEY" ]; then
            key_file="$RUNNER_TEMP/sftp-private-key"
            printf '%s\n' "$SFTP_PRIVATE_KEY" > "$key_file"
            chmod 600 "$key_file"

            sftp \
              -b "$batch_file" \
              -P 22 \
              "${host_key_algorithms_option[@]}" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$GITHUB_WORKSPACE/.sftp-known_hosts" \
              -i "$key_file" \
              "$SFTP_USERNAME@$SFTP_HOST"
          else
            if ! command -v sshpass >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends sshpass
            fi

            SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
              -oBatchMode=no \
              -b "$batch_file" \
              -P 22 \
              "${host_key_algorithms_option[@]}" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$GITHUB_WORKSPACE/.sftp-known_hosts" \
              "$SFTP_USERNAME@$SFTP_HOST"
          fi
