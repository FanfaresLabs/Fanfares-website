name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This repo deploys the committed static dist/ build output.
      # Keep these secrets configured in GitHub Actions:
      # - SFTP_HOST
      # - SFTP_USERNAME
      # - SFTP_PASSWORD
      # Optional hardening:
      # - SFTP_HOST_FINGERPRINT (recommended to pin the server host key)
      - name: Verify built site artifact
        run: |
          test -d dist
          test -f dist/index.html

      - name: Deploy via SFTP mirror
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: 22
          user: ${{ secrets.SFTP_USERNAME }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          fingerprint: ${{ secrets.SFTP_HOST_FINGERPRINT }}
          localDir: ./dist
          remoteDir: /public/fanfares
          reverse: true
          onlyNewer: false
          options: --delete --verbose
          settings: sftp:auto-confirm=yes
