<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fanfares app promo composite</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05030a;
      }

      .ticket {
        position: relative;
        width: 1536px;
        height: 1024px;
        overflow: hidden;
      }

      .promo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .bus-logo {
        position: absolute;
        right: 140px;
        bottom: 245px;
        width: 86px;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.42));
      }
    </style>
  </head>
  <body>
    <main class="ticket">
      <img class="promo" src="assets/Fanfares%20App%20Promo.png" alt="" />
      <img class="bus-logo" src="assets/fanfares_crest_256x256.png" alt="" />
    </main>
  </body>
</html>
